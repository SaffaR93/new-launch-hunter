name: Daily BugBounty Automation

on:
  schedule:
    - cron: "0 6 * * *"   # اجرای روزانه ساعت 06:00 صبح
  workflow_dispatch:       # اجرای دستی

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install subfinder
      run: |
        curl -s https://api.github.com/repos/projectdiscovery/subfinder/releases/latest \
        | grep "browser_download_url.*linux_amd64.zip" \
        | cut -d '"' -f 4 \
        | wget -qi -
        unzip subfinder_*_linux_amd64.zip
        sudo mv subfinder /usr/local/bin/

    - name: Run automation
      run: |
        python3 run.py

    - name: Upload output
      uses: actions/upload-artifact@v3

    - name: Send report to Discord
      run: |
        curl -H "Content-Type: application/json" \
        -d "{\"content\": \"Daily report generated. Check surface.json.\"}" \
        ${{ secrets.DISCORD_WEBHOOK }}
      with:
        name: surface-output
        path: output/surface.json
